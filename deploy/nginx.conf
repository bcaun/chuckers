# Сайт мини-аппа для уже работающего nginx. Установщик подставляет домен и порт,
# а certbot потом сам добавляет блок HTTPS (443) и редирект с HTTP.
map $http_upgrade $chuckers_connection {
	default upgrade;
	''      close;
}

server {
	listen 80;
	server_name __DOMAIN__;

	client_max_body_size 1m;

	location / {
		proxy_pass http://127.0.0.1:__PORT__;
		proxy_http_version 1.1;
		# WebSocket для игры с другом
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $chuckers_connection;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 1h;
	}
}
